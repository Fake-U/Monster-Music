
name: MonsterMusic Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MonsterMusic APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. 获取 GitHub 仓库源码
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. 配置 Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 3. 初始化 Android SDK
      # 使用 v4，避免旧版尝试安装已经废弃的 tools 包
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. 自动查找 Gradle 项目目录
      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          echo "GitHub workspace:"
          echo "$GITHUB_WORKSPACE"

          echo "Repository files:"
          ls -la "$GITHUB_WORKSPACE"

          GRADLEW_PATH="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 6 \
            -type f \
            -name gradlew \
            -not -path "*/.gradle/*" \
            -print -quit)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::Cannot find gradlew."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"

          echo "Gradle project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. 检查 Gradle 项目文件
      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo "Gradle configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo "Project build files:"
          find . -maxdepth 4 \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -print

      # 6. 安装项目需要的 Android SDK
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      # 7. 处理 Android 37 平台目录兼容问题
      - name: Configure Android 37 platform compatibility
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && \
             [ ! -e "$SDK_ROOT/platforms/android-37" ]; then

            ln -s android-37.0 \
              "$SDK_ROOT/platforms/android-37"

            echo "Created Android 37 compatibility alias."
          fi

          echo "Installed Android platforms:"
          ls -la "$SDK_ROOT/platforms"

      # 8. 验证 SDK 安装结果
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo "Java:"
          java -version

          echo "Android SDK:"
          sdkmanager --list_installed

          test -d "$SDK_ROOT/platforms/android-37.0"
          test -d "$SDK_ROOT/build-tools/37.0.0"
          test -d "$SDK_ROOT/ndk/30.0.16248370"
          test -d "$SDK_ROOT/cmake/3.22.1"

          echo "Android SDK verification passed."

      # 9. 构建 Debug 和 Release APK
      - name: Build APKs
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug \
            assembleRelease

      # 10. 收集生成的 APK
      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build-output"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -print0 |
          while IFS= read -r -d '' apk; do
            relative_path="${apk#"$PROJECT_DIR"/}"
            safe_name="${relative_path//\//-}"

            cp "$apk" \
              "$GITHUB_WORKSPACE/build-output/$safe_name"
          done

          echo "APK output:"
          ls -lh "$GITHUB_WORKSPACE/build-output"

          if ! find "$GITHUB_WORKSPACE/build-output" \
            -type f -name "*.apk" -print -quit | grep -q .; then
            echo "::error::No APK files were generated."
            exit 1
          fi

      # 11. 上传 APK 到 GitHub Actions
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MonsterMusic-APKs
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 14
