name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android build components
        run: |
          set -euo pipefail
          # 只安装确实存在的包；不存在的会报错以便尽早发现
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1"
          # NDK 版本请按项目实际需要调整；此处放注释示例，避免安装不存在的 r30
          # "ndk;27.0.12077973"

      - name: Verify installed SDK components
        run: sdkmanager --list_installed

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew missing, generating wrapper..."
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Build APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p build-output
          # 覆盖所有模块的输出目录，避免硬编码 :app
          while IFS= read -r -d '' apk; do
            # 用路径里的模块名做前缀，避免同名覆盖
            module=$(echo "$apk" | sed -E 's#(^\./)?([^/]+)/build/.*#\2#')
            base=$(basename "$apk")
            cp "$apk" "build-output/${module}-${base}"
          done < <(find . -path "*/build/outputs/apk/*" -type f -name "*.apk" -print0)
          test -n "$(find build-output -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MonsterMusic-APKs
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 14
