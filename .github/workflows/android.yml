
name: MonsterMusic Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MonsterMusic APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. 获取 GitHub 仓库
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. 配置 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 3. 初始化 Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. 安装解压工具
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      # 5. 解压源码 ZIP 并定位 Gradle 项目
      - name: Extract and locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          SOURCE_ZIP="MonsterMusic_Source.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::MonsterMusic_Source.zip not found."
            ls -lah
            exit 1
          fi

          echo "Source ZIP:"
          ls -lh "$SOURCE_ZIP"

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$SOURCE_ZIP" -d "$GITHUB_WORKSPACE/source"

          echo "Extracted source files:"
          ls -lah "$GITHUB_WORKSPACE/source"

          GRADLEW_PATH="$(find "$GITHUB_WORKSPACE/source" \
            -maxdepth 10 \
            -type f \
            -name gradlew \
            -not -path "*/.gradle/*" \
            -print -quit)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew not found inside source ZIP."

            echo "ZIP contents:"
            unzip -l "$SOURCE_ZIP" | head -100

            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW_PATH"

      # 6. 验证 Gradle 项目
      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Gradle wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo "Build files:"
          find . -maxdepth 4 \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -print

      # 7. 接受 Android SDK 许可
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # 8. 安装 Android SDK 组件
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      # 9. 验证 Android SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo "Java:"
          java -version

          echo "Installed SDK packages:"
          sdkmanager --list_installed

          test -d "$SDK_ROOT/platforms/android-37"
          test -d "$SDK_ROOT/build-tools/37.0.0"
          test -d "$SDK_ROOT/ndk/30.0.16248370"
          test -d "$SDK_ROOT/cmake/3.22.1"

          echo "Android SDK verification passed."

      # 10. 构建 Debug 和 Release APK
      - name: Build APKs
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug \
            assembleRelease

      # 11. 收集 APK
      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build-output"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -print0 |
          while IFS= read -r -d '' apk; do
            relative_path="${apk#"$PROJECT_DIR"/}"
            safe_name="${relative_path//\//-}"

            cp "$apk" \
              "$GITHUB_WORKSPACE/build-output/$safe_name"
          done

          echo "Generated APK files:"
          ls -lh "$GITHUB_WORKSPACE/build-output"

          if ! find "$GITHUB_WORKSPACE/build-output" \
            -type f -name "*.apk" -print -quit | grep -q .; then

            echo "::error::No APK files generated."
            exit 1
          fi

      # 12. 上传 APK
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MonsterMusic-APKs
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 14
