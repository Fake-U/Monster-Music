
name: MonsterMusic Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. 获取源码
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. 配置 Java
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 3. 配置 Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. 自动定位 Gradle 项目根目录
      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository directory:"
          pwd

          echo "Repository contents:"
          ls -la

          GRADLEW_PATH="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 6 \
            -type f \
            -name gradlew \
            -not -path "*/.gradle/*" \
            -print -quit)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::Cannot find gradlew in repository."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"

          echo "Found project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. 检查项目文件
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Gradle files:"
          find . -maxdepth 4 \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradle-wrapper.properties" \) \
            -print

          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.jar
          test -f ./gradle/wrapper/gradle-wrapper.properties

          echo "Gradle distribution:"
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

          chmod +x ./gradlew

      # 6. 接受 Android SDK 许可
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # 7. 安装构建组件
      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      # 8. 检查构建环境
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Java version:"
          java -version

          echo "Android SDK:"
          sdkmanager --list_installed

          echo "NDK:"
          test -d "$ANDROID_HOME/ndk/30.0.16248370"

          echo "CMake:"
          test -d "$ANDROID_HOME/cmake/3.22.1"

          echo "Android platform:"
          test -d "$ANDROID_HOME/platforms/android-37"

          echo "Build tools:"
          test -d "$ANDROID_HOME/build-tools/37.0.0"

          echo "Environment verification passed."

      # 9. 构建 Debug 和 Release APK
      - name: Build APKs
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug \
            assembleRelease

      # 10. 收集 APK
      - name: Collect APK artifacts
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          mkdir -p "$GITHUB_WORKSPACE/build-output"

          find . \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -print0 |
          while IFS= read -r -d '' apk; do
            relative_path="${apk#./}"
            safe_name="${relative_path//\//-}"

            cp "$apk" "$GITHUB_WORKSPACE/build-output/$safe_name"
          done

          echo "Generated APK files:"
          ls -lh "$GITHUB_WORKSPACE/build-output"

          if ! find "$GITHUB_WORKSPACE/build-output" \
            -type f -name "*.apk" -print -quit | grep -q .; then
            echo "::error::No APK files were generated."
            exit 1
          fi

      # 11. 上传 APK
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MonsterMusic-APKs
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 14
