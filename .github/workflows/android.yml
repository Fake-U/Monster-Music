
name: MonsterMusic Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MonsterMusic APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. 获取 GitHub 仓库
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. 配置 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 3. 初始化 Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. 检查源码 ZIP
      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          if [ ! -f "MonsterMusic_Source.zip" ]; then
            echo "::error::MonsterMusic_Source.zip not found."
            ls -lah
            exit 1
          fi

          echo "Source archive:"
          ls -lh MonsterMusic_Source.zip

          unzip -t MonsterMusic_Source.zip

      # 5. 解压源码并定位 Gradle 项目
      - name: Extract and locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q \
            "$GITHUB_WORKSPACE/MonsterMusic_Source.zip" \
            -d "$GITHUB_WORKSPACE/source"

          echo "Extracted source:"
          ls -lah "$GITHUB_WORKSPACE/source"

          GRADLEW_PATH="$(find "$GITHUB_WORKSPACE/source" \
            -maxdepth 10 \
            -type f \
            -name gradlew \
            -not -path "*/.gradle/*" \
            -print -quit)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew not found in source archive."

            unzip -l "$GITHUB_WORKSPACE/MonsterMusic_Source.zip" | head -100

            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW_PATH"

      # 6. 验证 Gradle Wrapper
      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Gradle wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo "Project build files:"
          find . -maxdepth 4 \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -print

      # 7. 检查 Android SDK 仓库中的 API 37 包名
      - name: Detect Android 37 SDK package
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --list --channel=3 > "$RUNNER_TEMP/sdk-packages.txt"

          echo "Available Android 37 packages:"
          grep -E 'platforms;android-37(\.0)?[[:space:]]*\|' \
            "$RUNNER_TEMP/sdk-packages.txt" || true

          PLATFORM_PACKAGE="$(
            awk -F '|' '
              {
                gsub(/^[ \t]+|[ \t]+$/, "", $1)
              }
              $1 == "platforms;android-37" ||
              $1 == "platforms;android-37.0" {
                print $1
                exit
              }
            ' "$RUNNER_TEMP/sdk-packages.txt"
          )"

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "::error::Android API 37 SDK package is not available."

            echo "Available platform packages:"
            grep -E 'platforms;android-' \
              "$RUNNER_TEMP/sdk-packages.txt" || true

            exit 1
          fi

          echo "Selected SDK package: $PLATFORM_PACKAGE"
          echo "ANDROID_PLATFORM_PACKAGE=$PLATFORM_PACKAGE" >> "$GITHUB_ENV"

      # 8. 安装 Android SDK、NDK 和 CMake
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install --channel=3 \
            "$ANDROID_PLATFORM_PACKAGE" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      # 9. 验证 SDK 安装
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path is not configured."
            exit 1
          fi

          echo "Android SDK: $SDK_ROOT"

          echo "Installed packages:"
          sdkmanager --list_installed

          PLATFORM_NAME="${ANDROID_PLATFORM_PACKAGE#platforms;}"

          test -d "$SDK_ROOT/platforms/$PLATFORM_NAME"
          test -d "$SDK_ROOT/ndk/30.0.16248370"
          test -d "$SDK_ROOT/cmake/3.22.1"
          test -d "$SDK_ROOT/platform-tools"

          echo "SDK verification passed."

      # 10. 构建 Debug 和 Release APK
      - name: Build APKs
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug \
            assembleRelease

      # 11. 收集 APK
      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="$GITHUB_WORKSPACE/build-output"

          mkdir -p "$OUTPUT_DIR"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -print0 |
          while IFS= read -r -d '' apk; do

            relative_path="${apk#"$PROJECT_DIR"/}"
            safe_name="${relative_path//\//-}"

            cp "$apk" "$OUTPUT_DIR/$safe_name"

          done

          echo "Generated APK files:"
          ls -lh "$OUTPUT_DIR"

          if ! find "$OUTPUT_DIR" \
            -type f -name "*.apk" -print -quit | grep -q .; then

            echo "::error::No APK files were generated."
            exit 1
          fi

      # 12. 上传 APK
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MonsterMusic-APKs
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 14
