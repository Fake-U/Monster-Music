
name: MonsterMusic Android Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug and Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. 获取源码
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. 配置 JDK
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 3. 配置 Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. 接受 SDK 许可证
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # 5. 安装项目所需构建组件
      - name: Install Android build components
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      # 6. 检查构建环境
      - name: Verify build environment
        run: |
          echo "Java version:"
          java -version

          echo "Gradle wrapper:"
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

          echo "Android SDK:"
          sdkmanager --list_installed

          echo "NDK:"
          test -d "$ANDROID_HOME/ndk/30.0.16248370"

          echo "CMake:"
          test -d "$ANDROID_HOME/cmake/3.22.1"

      # 7. 检查 Gradle Wrapper
      - name: Prepare Gradle wrapper
        run: |
          set -euo pipefail
          test -f ./gradlew
          chmod +x ./gradlew

      # 8. 编译 Debug 和 Release
      - name: Build APKs
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug \
            assembleRelease

      # 9. 收集 APK
      - name: Collect APK artifacts
        run: |
          set -euo pipefail

          mkdir -p build-output

          find . \
            -path "*/build/outputs/apk/*" \
            -type f \
            -name "*.apk" \
            -print0 |
          while IFS= read -r -d '' apk; do
            module=$(echo "$apk" | cut -d '/' -f2)
            base=$(basename "$apk")

            cp "$apk" "build-output/${module}-${base}"
          done

          echo "Generated APK files:"
          ls -lh build-output/

          test -n "$(find build-output -type f -name '*.apk' -print -quit)"

      # 10. 上传 APK
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MonsterMusic-APKs
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 14
