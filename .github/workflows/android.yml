name: MonsterMusic Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # ⚠️ 按项目 app/build.gradle(.kts) 实际值修改
      ANDROID_PLATFORM: "android-36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      # 项目用 NDK 才需要；不用就留空，后面步骤会自动跳过
      ANDROID_NDK: ""
      # "27.0.12077973"
      ANDROID_CMAKE: "3.22.1"

    steps:
      # 1. 获取源码
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. 配置 Java（v5 不存在，改回 v4；加 gradle 缓存）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 3. 配置 Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. 自动定位 Gradle 项目根目录
      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository directory:"
          pwd
          echo "Repository contents:"
          ls -la

          echo "All gradlew candidates:"
          mapfile -t WRAPPERS < <(find "$GITHUB_WORKSPACE" \
            -maxdepth 6 \
            -type f \
            -name gradlew \
            -not -path "*/.gradle/*" \
            -print)

          printf '  %s\n' "${WRAPPERS[@]:-<none>}"

          if [ "${#WRAPPERS[@]}" -eq 0 ]; then
            echo "::error::Cannot find gradlew in repository."
            exit 1
          fi

          # 优先取最浅（层级最少）的 gradlew 作为项目根
          GRADLEW_PATH="$(printf '%s\n' "${WRAPPERS[@]}" \
            | awk -F/ '{print NF"\t"$0}' | sort -n | head -n1 | cut -f2-)"

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"
          echo "Selected project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. 检查项目文件
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Project directory:"; pwd
          echo "Gradle files:"
          find . -maxdepth 4 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \
            -o -name "build.gradle" -o -name "build.gradle.kts" \
            -o -name "gradle-wrapper.properties" \) -print

          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.jar
          test -f ./gradle/wrapper/gradle-wrapper.properties

          echo "Gradle distribution:"
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      # 6. 接受许可
      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses > /dev/null || true

      # 7. 安装构建组件（按需、可跳过 NDK）
      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail

          PACKAGES=(
            "platform-tools"
            "platforms;${ANDROID_PLATFORM}"
            "build-tools;${ANDROID_BUILD_TOOLS}"
          )
          [ -n "${ANDROID_NDK}" ] && PACKAGES+=("ndk;${ANDROID_NDK}")
          [ -n "${ANDROID_CMAKE}" ] && PACKAGES+=("cmake;${ANDROID_CMAKE}")

          echo "Installing:"
          printf '  %s\n' "${PACKAGES[@]}"

          sdkmanager --install "${PACKAGES[@]}"

      # 8. 校验安装结果
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Java version:"; java -version
          echo "Android SDK:"; sdkmanager --list_installed

          test -d "$ANDROID_HOME/platforms/${ANDROID_PLATFORM}"
          test -d "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"
          [ -z "${ANDROID_NDK}" ]   || test -d "$ANDROID_HOME/ndk/${ANDROID_NDK}"
          [ -z "${ANDROID_CMAKE}" ] || test -d "$ANDROID_HOME/cmake/${ANDROID_CMAKE}"

          echo "Environment verification passed."

      # 9. 构建
      - name: Build APKs
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug \
            assembleRelease

      # 10. 收集 APK（用 process substitution，避免子 shell）
      - name: Collect APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          OUT="$GITHUB_WORKSPACE/build-output"
          mkdir -p "$OUT"

          found=0
          while IFS= read -r -d '' apk; do
            relative_path="${apk#./}"
            safe_name="${relative_path//\//-}"
            cp "$apk" "$OUT/$safe_name"
            found=$((found+1))
          done < <(find . -type f -path "*/build/outputs/apk/*" -name "*.apk" -print0)

          echo "Generated APK files ($found):"
          ls -lh "$OUT" || true

          if [ "$found" -eq 0 ]; then
            echo "::error::No APK files were generated."
            exit 1
          fi

      # 11. 上传
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MonsterMusic-APKs
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 14
